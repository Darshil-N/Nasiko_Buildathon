# SiteScout services (free, local). Nasiko runs separately from D:\Projects\Nasiko.
# Nothing here is started without the owner's approval (rule 2, gate G-DB).
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sitescout-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitescout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitescout}
      POSTGRES_DB: ${POSTGRES_DB:-sitescout}
    ports:
      # Bound to localhost only, and on 5433 because Nasiko's own Postgres already uses 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - sitescout_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitescout} -d ${POSTGRES_DB:-sitescout}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sitescout-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is "db" on its normal port.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sitescout}:${POSTGRES_PASSWORD:-sitescout}@db:5432/${POSTGRES_DB:-sitescout}
      BACKEND_API_KEY: ${BACKEND_API_KEY:?set BACKEND_API_KEY in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8501}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NASIKO_BASE_URL: ${NASIKO_BASE_URL_IN_DOCKER:-http://host.docker.internal:8080}
      NASIKO_USERNAME: ${NASIKO_USERNAME:-}
      NASIKO_PASSWORD: ${NASIKO_PASSWORD:-}
      USE_NASIKO_AGENTS: ${USE_NASIKO_AGENTS:-false}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  sitescout_pgdata:
