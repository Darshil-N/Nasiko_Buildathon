# Category configuration: pharmacy
# Values from architecture-1.md §5.6 and Appendix B (landmark weight table).
# Pharmacy wants residential density and proximity to healthcare; residential-only cells
# are kept but flagged (pharmacy exception in the hard filters).

category: pharmacy
version: "2026-09-a"
h3_resolution: 9
catchment_k: 2           # walkable radius, same as cafe
decay_lambda_m: 300      # shortest decay – pharmacy serves the immediate neighbourhood

tier_labels:
  budget: "Lower class"
  mid: "Medium class"
  premium: "Niche"

tier_targets:
  budget: 0.30
  mid: 0.55
  premium: 0.80

tier_fit:
  shortfall_penalty: 2.0
  overshoot_penalty: 0.8

weights:
  F1_anchor_footfall:      0.20
  F2_affluence_fit:        0.07
  F3_residential_demand:   0.25
  F4_retail_cluster:       0.03
  F5_competition_inverted: 0.20
  F6_gap_opportunity:      0.10
  F7_accessibility:        0.07
  F8_rent_efficiency:      0.05
  F9_growth_momentum:      0.03

poi_weights:
  hospital:        1.0
  clinic:          0.9
  doctors:         0.9
  diagnostic_lab:  0.9
  supermarket:     0.4
  bus_stop:        0.3
  rail_or_metro:   0.3
  marketplace:     0.3
  school:          0.2
  college:         0.2
  university:      0.2
  office:          0.2
  mall:            0.2
  place_of_worship: 0.2
  cinema:          0.1

competitor_categories: [pharmacy]
complementary_categories: [hospital, clinic, doctors, diagnostic_lab]

answer_modifiers:
  is_24x7.yes:        {hospital: 1.3, clinic: 1.3}
  nearby_clinics.yes: {clinic: 1.5, doctors: 1.5, diagnostic_lab: 1.5}

hard_filters:
  rent_budget_multiplier: 1.2
  # pharmacy exception: residential-only cells are kept, but flagged
  residential_only_flag: true
  exclude_land_use: []
  min_confidence_ranked: 0.25
